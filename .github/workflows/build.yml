
name: Build Skyline Freecam

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build mod
        run: gradle build

      - name: Save JAR files
        uses: actions/upload-artifact@v4
        with:
          name: Skyline-Freecam-JAR
          path: build/libs/*.jar
          if-no-files-found: error
